version: "3.9"

# =============================================================================
# Cyber Platform — Docker Compose
# =============================================================================
# Start: docker compose up
# All credentials are read from .env (copy .env.example → .env first)
# =============================================================================

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyberplatform}
      POSTGRES_USER: ${POSTGRES_USER:-cyberuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberpass_changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberuser} -d ${POSTGRES_DB:-cyberplatform}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cyber_net

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_changeme}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - cyber_net

  # ── API ──────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-changeme_dev_only}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-changeme_dev_only}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cyberuser}:${POSTGRES_PASSWORD:-cyberpass_changeme}@postgres:5432/${POSTGRES_DB:-cyberplatform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_changeme}@redis:6379/0
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-analysis}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      STORAGE_ROOT: /app/storage
      QUARANTINE_ROOT: /app/quarantine
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10/minute}
      SEARCHAPI_API_KEY: ${SEARCHAPI_API_KEY:-}
      SEARCHAPI_ENGINE: ${SEARCHAPI_ENGINE:-google_lens}
      SEARCHAPI_ENABLED: ${SEARCHAPI_ENABLED:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      ALLOW_TEST_MOCK_PROVIDER: ${ALLOW_TEST_MOCK_PROVIDER:-false}
    volumes:
      - ./backend:/app
      - app_storage:/app/storage
      - app_quarantine:/app/quarantine
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cyber_net

  # ── Worker ───────────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-changeme_dev_only}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-changeme_dev_only}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cyberuser}:${POSTGRES_PASSWORD:-cyberpass_changeme}@postgres:5432/${POSTGRES_DB:-cyberplatform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_changeme}@redis:6379/0
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-analysis}
      STORAGE_ROOT: /app/storage
      QUARANTINE_ROOT: /app/quarantine
      SEARCHAPI_API_KEY: ${SEARCHAPI_API_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    volumes:
      - ./backend:/app
      - app_storage:/app/storage
      - app_quarantine:/app/quarantine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cyber_net

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - cyber_net

volumes:
  postgres_data:
  redis_data:
  app_storage:
  app_quarantine:

networks:
  cyber_net:
    driver: bridge
